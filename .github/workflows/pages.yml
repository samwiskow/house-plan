name: Verify and publish house
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: house-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install check dependencies
        run: |
          python -m pip install reportlab==4.4.3 pdfplumber==0.11.7
          npm install --prefix "$RUNNER_TEMP/house-checks" playwright@1.55.0
          "$RUNNER_TEMP/house-checks/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify model and book
        run: |
          python viewer/export_model.py
          git diff --exit-code -- viewer/model.json
          python scripts/check_design_book.py
      - name: Stage public presentation
        run: python scripts/build_pages.py
      - name: Check the staged site in Chromium
        run: |
          python -m http.server 4186 --bind 127.0.0.1 --directory tmp/pages > "$RUNNER_TEMP/house-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:4186/ > /dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/house-checks/node_modules" node scripts/check_viewer.cjs
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: tmp/pages
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
